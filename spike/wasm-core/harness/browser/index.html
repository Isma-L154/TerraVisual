<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TerraVisual spike — browser benchmark</title>
<style>
  body { font: 14px ui-monospace, monospace; margin: 24px; background: #12121a; color: #e6e6ef; }
  h1 { font-size: 16px; }
  table { border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: right; padding: 4px 14px; border-bottom: 1px solid #333; }
  th:first-child, td:first-child { text-align: left; }
  .ok { color: #4ade80; } .bad { color: #f87171; }
  #status { margin-top: 10px; opacity: .8; }
</style>
</head>
<body>
<h1>TerraVisual spike — analyzer in a Web Worker</h1>
<div id="status">running…</div>
<table id="out"><thead>
  <tr><th>workspace</th><th>resources</th><th>p50</th><th>p95</th><th>max</th></tr>
</thead><tbody></tbody></table>

<script type="module">
const worker = new Worker('/worker.js');
const tbody = document.querySelector('#out tbody');
const status = document.getElementById('status');

const workspaces = [
  ['testdata',        ['/fixtures/testdata/variables.tf', '/fixtures/testdata/main.tf']],
  ['fixtures/n50',    ['/fixtures/n50/main.tf']],
  ['fixtures/n200',   ['/fixtures/n200/main.tf']],
  ['fixtures/n1000',  ['/fixtures/n1000/main.tf']],
];

let nextId = 0;
const pending = new Map();
worker.onmessage = (e) => {
  const resolve = pending.get(e.data.id);
  pending.delete(e.data.id);
  resolve(e.data);
};
function run(files, runs) {
  const id = nextId++;
  return new Promise((resolve) => {
    pending.set(id, resolve);
    worker.postMessage({ id, files, runs });
  });
}

const results = [];
for (const [name, urls] of workspaces) {
  const files = {};
  for (const url of urls) {
    files[url.split('/').pop()] = await (await fetch(url)).text();
  }
  const r = await run(files, 30);
  results.push({ name, ...r });

  const tr = document.createElement('tr');
  if (!r.ok) {
    tr.innerHTML = `<td>${name}</td><td colspan="4" class="bad">${r.error}</td>`;
  } else {
    tr.innerHTML = `<td>${name}</td><td>${r.stats.resources}</td>` +
      `<td>${r.p50.toFixed(1)} ms</td><td>${r.p95.toFixed(1)} ms</td><td>${r.max.toFixed(1)} ms</td>`;
  }
  tbody.appendChild(tr);
}

const boot = results.find((r) => r.bootMs != null)?.bootMs;
status.textContent = `cold instantiation ${boot ? boot.toFixed(1) + ' ms' : 'n/a'} — done`;
status.className = results.every((r) => r.ok) ? 'ok' : 'bad';

// Exposed so an automated driver can read the numbers without scraping the DOM.
window.__spikeResults = { boot, results };
window.__spikeDone = true;
</script>
</body>
</html>
