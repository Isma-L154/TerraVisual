<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TerraVisual — Visualize Terraform as a live diagram</title>
    <meta
      name="description"
      content="Free Terraform visualizer. Write HCL and watch the AWS, Azure and GCP infrastructure it describes become a live diagram. Your code never leaves your browser."
    />
    <link rel="canonical" href="https://terravisual.cloudils.com/" />

    <!-- What a shared link unfurls into. Absolute URLs: crawlers resolve nothing. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TerraVisual" />
    <meta
      property="og:title"
      content="TerraVisual — see the infrastructure your Terraform describes"
    />
    <meta
      property="og:description"
      content="Write Terraform and watch it become a diagram of the infrastructure it describes. Free, for AWS, Azure and GCP, and your code never leaves your browser."
    />
    <meta property="og:url" content="https://terravisual.cloudils.com/" />
    <meta property="og:image" content="https://terravisual.cloudils.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TerraVisual: a few lines of Terraform beside the diagram they describe, a VPC holding a subnet and its resources."
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="TerraVisual — see the infrastructure your Terraform describes"
    />
    <meta
      name="twitter:description"
      content="Write Terraform and watch it become a diagram of the infrastructure it describes. Free, for AWS, Azure and GCP, and your code never leaves your browser."
    />
    <meta name="twitter:image" content="https://terravisual.cloudils.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="TerraVisual: a few lines of Terraform beside the diagram they describe, a VPC holding a subnet and its resources."
    />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#3b5bdb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12121a" media="(prefers-color-scheme: dark)" />

    <!--
      Structured data for search engines. A JSON data block, not a script: the
      browser never executes it, so script-src does not apply to it.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TerraVisual",
        "url": "https://terravisual.cloudils.com/",
        "description": "Free Terraform visualizer. Write HCL and watch the AWS, Azure and GCP infrastructure it describes become a live diagram. Your code never leaves your browser.",
        "applicationCategory": "DeveloperApplication",
        "applicationSubCategory": "Infrastructure as Code",
        "operatingSystem": "Any (runs in the browser)",
        "browserRequirements": "Requires JavaScript and WebAssembly.",
        "isAccessibleForFree": true,
        "inLanguage": "en",
        "image": "https://terravisual.cloudils.com/og-image.png",
        "license": "https://www.apache.org/licenses/LICENSE-2.0",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>TerraVisual</h1>
      <p>
        TerraVisual turns Terraform into a diagram of the infrastructure it describes, as you write
        it: networks, compute, storage and databases on AWS, Azure and GCP, drawn inside the
        containers they belong to. It runs entirely in your browser, so your code is never uploaded.
      </p>
      <p>It needs JavaScript and WebAssembly to run.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
