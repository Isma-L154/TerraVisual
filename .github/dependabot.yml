version: 2

# The dependency surface here is deliberately small, which only helps if it
# stays current. Weekly is frequent enough to keep updates reviewable and rare
# enough that they do not become noise people learn to ignore. The cooldown
# keeps a release out until it has been public for a week, which is when
# malicious versions are usually caught and pulled.
updates:
  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # react and react-dom refuse to run at different versions, so bumping
      # them in separate pull requests makes both fail.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      dev-tooling:
        dependency-type: development
    ignore:
      # Versions after 1.11.11 drop edge paths from the PNG export (#128), as
      # React Flow's download-image guide warns. CI checks the file, not the
      # drawing, so it cannot catch this.
      - dependency-name: html-to-image
        versions: ['> 1.11.11']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
