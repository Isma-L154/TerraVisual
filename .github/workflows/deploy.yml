name: Deploy

on:
  pull_request:
  # Production deploys only once CI has passed on main, rather than racing it.
  # workflow_run runs with the repository's secrets whatever started it, so the
  # job below acts only on a CI run started by a push to this repository, and
  # checks out exactly the commit that run tested.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest

    # A pull request from a fork has no secrets, so it skips cleanly rather
    # than failing with a red X nobody can fix. A completed CI run deploys only
    # if it passed and was started by a push here: a fork's branch can also be
    # called main.
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository)
      }}

    permissions:
      contents: read
      pull-requests: write

    steps:
      # On workflow_run, github.sha is whatever main points at by now; the
      # commit to deploy is the one CI tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: '**/go.sum'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check for credentials
        id: credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed. See docs/deployment/README.md."
          fi

      - name: Build
        if: steps.credentials.outputs.available == 'true'
        run: npm run build

      # A pull request gets a versioned preview URL rather than taking over the
      # live site, which is what makes reviewing a change on a real deployment
      # possible without publishing it.
      - name: Upload preview version
        id: preview
        if: steps.credentials.outputs.available == 'true' && github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          output=$(npx wrangler versions upload --message "PR #${{ github.event.number }}" 2>&1 | tee /dev/stderr)
          url=$(echo "$output" | grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        if: steps.credentials.outputs.available == 'true' && github.event_name == 'workflow_run'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # The audit baseline forbids inferring a control from configuration. This
      # reads the headers off the deployment that was just made, so a policy
      # that stopped being served would fail the build rather than the user.
      - name: Verify security headers on the deployment
        if: steps.credentials.outputs.available == 'true'
        env:
          TARGET: ${{ github.event_name == 'pull_request' && steps.preview.outputs.url || secrets.PRODUCTION_URL }}
        run: |
          if [ -z "$TARGET" ]; then
            echo "::warning::No URL to verify headers against."
            exit 0
          fi
          node scripts/check-headers.mjs "$TARGET" --strict-tls

      - name: Comment the preview URL
        if: steps.credentials.outputs.available == 'true' && github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- terravisual-preview -->';
            const body = `${marker}\n**Preview:** ${url}\n\nSecurity headers were verified against this deployment.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            // Updated rather than appended, so a long-lived branch does not
            // accumulate a column of near-identical comments.
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
