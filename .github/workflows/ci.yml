name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

# A superseded run tells you nothing useful, so stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Analysis core (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: '**/go.sum'

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check formatting
        working-directory: core
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: core
        run: go vet ./...

      - name: Test
        working-directory: core
        run: go test -race ./...

      # The analyzer is the only component that processes untrusted input, so
      # it gets fuzzed on every change. Short here by design; longer campaigns
      # belong in a scheduled run.
      - name: Fuzz (short)
        working-directory: core
        run: go test ./internal/analyzer -run XXX -fuzz FuzzAnalyze -fuzztime 30s

      # Builds the artifact and fails if it exceeds the NFR-5 budget, so a size
      # regression is caught by CI rather than noticed in production.
      - name: Build WebAssembly artifact and check size budget
        run: node scripts/build-core.mjs

  web:
    name: Browser application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:web

      - name: Build
        run: npm run build:web

  e2e:
    name: Browser suite (accessibility, keyboard, performance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The suite runs against the deployment Worker serving the real build, so
      # it needs the analyzer as well as the application: an accessibility pass
      # over a page whose diagram never arrives would prove nothing.
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: '**/go.sum'

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Everything that does not time anything, in parallel.
      - name: Accessibility, keyboard journey and security policy
        run: >-
          npx playwright test
          web/e2e/accessibility.spec.ts
          web/e2e/keyboard.spec.ts
          web/e2e/security.spec.ts

      # Alone on the machine. Timing anything while a second browser competes
      # for the same two cores measures the runner, not the application.
      - name: Performance budgets
        run: npx playwright test web/e2e/performance.spec.ts --workers=1

      # Only on failure, and only for a week: a trace is a recording of a
      # browser session and there is no reason to keep one that passed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: '**/go.sum'

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Every Go module, not just core. A core-only scan would have missed a
      # reachable denial-of-service in golang.org/x/text that the spike module
      # pulled in through hcl — and reachability is the whole point of
      # govulncheck over an advisory feed.
      - name: Known vulnerabilities in Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          status=0
          for dir in $(find . -name go.mod -not -path './node_modules/*' -exec dirname {} \;); do
            echo "::group::govulncheck $dir"
            if output=$(cd "$dir" && govulncheck ./... 2>&1); then
              echo "$output"
            elif echo "$output" | grep -q 'no packages matched'; then
              # A module whose sources are all behind js/wasm build tags has
              # nothing to scan on this runner. Skipped deliberately and
              # reported, rather than swallowed with the real failures.
              echo "no buildable packages on linux/amd64; nothing to scan"
            else
              echo "$output"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - run: npm ci

      - name: Known vulnerabilities in npm dependencies
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
