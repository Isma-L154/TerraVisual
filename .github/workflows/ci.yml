name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

# A superseded run tells you nothing useful, so stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Analysis core (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check formatting
        working-directory: core
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: core
        run: go vet ./...

      - name: Test
        working-directory: core
        run: go test -race ./...

      # The analyzer is the only component that processes untrusted input, so
      # it gets fuzzed on every change. Short here by design; longer campaigns
      # belong in a scheduled run.
      - name: Fuzz (short)
        working-directory: core
        run: go test ./internal/analyzer -run XXX -fuzz FuzzAnalyze -fuzztime 30s

      # Builds the artifact and fails if it exceeds the NFR-5 budget, so a size
      # regression is caught by CI rather than noticed in production.
      - name: Build WebAssembly artifact and check size budget
        run: node scripts/build-core.mjs

  web:
    name: Browser application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:web

      - name: Build
        run: npm run build:web

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Known vulnerabilities in Go dependencies
        working-directory: core
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - run: npm ci

      - name: Known vulnerabilities in npm dependencies
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
