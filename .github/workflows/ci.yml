name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

# A superseded run tells you nothing useful, so stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Analysis core (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: '**/go.sum'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check formatting
        working-directory: core
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: core
        run: go vet ./...

      - name: Test
        working-directory: core
        run: go test -race ./...

      # The analyzer is the only component that processes untrusted input, so
      # it gets fuzzed on every change. Short here by design; longer campaigns
      # belong in a scheduled run.
      - name: Fuzz (short)
        working-directory: core
        run: go test ./internal/analyzer -run XXX -fuzz FuzzAnalyze -fuzztime 30s

      # Builds the artifact and fails if it exceeds the NFR-5 budget, so a size
      # regression is caught by CI rather than noticed in production.
      - name: Build WebAssembly artifact and check size budget
        run: node scripts/build-core.mjs

  web:
    name: Browser application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The TypeScript types and the Go copy of the catalog are generated from
      # schemas/ and catalog/. A change to either that was not regenerated
      # would otherwise pass, with the two languages disagreeing.
      - name: Generated code is up to date
        run: npm run generate:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:web

      - name: Build
        run: npm run build:web

  e2e:
    name: Browser suite (accessibility, keyboard, performance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The suite runs against the deployment Worker serving the real build, so
      # it needs the analyzer as well as the application: an accessibility pass
      # over a page whose diagram never arrives would prove nothing.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: '**/go.sum'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Every spec except the budgets, in parallel. The same script runs
      # locally, so a new spec cannot be left out of CI by a hand-kept list.
      - name: Browser suite
        run: npm run test:e2e:browser

      # Alone on the machine. Timing anything while a second browser competes
      # for the same two cores measures the runner, not the application.
      - name: Performance budgets
        run: npm run test:e2e:performance

      # Only on failure, and only for a week: a trace is a recording of a
      # browser session and there is no reason to keep one that passed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: '**/go.sum'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Every Go module, so one added later is scanned without anyone
      # remembering to add it here.
      - name: Known vulnerabilities in Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          status=0
          for dir in $(find . -name go.mod -not -path './node_modules/*' -exec dirname {} \;); do
            echo "::group::govulncheck $dir"
            if output=$(cd "$dir" && govulncheck ./... 2>&1); then
              echo "$output"
            elif echo "$output" | grep -q 'no packages matched'; then
              # A module whose sources are all behind js/wasm build tags has
              # nothing to scan on this runner. Skipped deliberately and
              # reported, rather than swallowed with the real failures.
              echo "no buildable packages on linux/amd64; nothing to scan"
            else
              echo "$output"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - run: npm ci

      - name: Known vulnerabilities in npm dependencies
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
